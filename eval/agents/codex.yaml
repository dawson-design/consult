# Harbor AgentConfig fragment for Codex. eval/scripts/run.py merges it into a job.
# Auth: CODEX_FORCE_AUTH_JSON uploads ~/.codex/auth.json (ChatGPT login) into the
# sandbox, so no OPENAI_API_KEY is needed. Set CODEX_AUTH_JSON_PATH for another file.
# host_env is exported by run.py into the `harbor run` process, not written into
# the job config (see agents/claude-code.yaml for why).
name: codex
model_name: openai/gpt-5.5
# resume_trajectory continues the same session in each later step of a
# multi-step task (the scripted approval turn). Single-step tasks ignore it.
resume_trajectory: true
kwargs:
  # Matches the CLI preinstalled in verifier/shared/Dockerfile, so Harbor skips its install.
  version: "0.156.1"
  reasoning_effort: medium
  # Uploaded as $CODEX_HOME/config.toml. Harbor builds the trajectory from the newest
  # rollout and resumes with `codex exec resume --last`, and both pick a subagent's.
  config:
    features:
      multi_agent: false
host_env:
  CODEX_FORCE_AUTH_JSON: "true"
