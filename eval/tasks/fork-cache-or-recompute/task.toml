schema_version = "1.3"

[task]
name = "consult/fork-cache-or-recompute"
description = "Add a frequently called summary endpoint over a small, hand-edited catalog file."

[metadata]
kind = "code"
features = ["api", "performance"]

# Generous on purpose: an Opus turn at xhigh effort can run long, and a cut-off
# turn scores the harness, not the agent.
[agent]
timeout_sec = 2700.0

# No rubric: the verifier runs no judge, only the hidden check and the fork probe.
[verifier]
timeout_sec = 600.0

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
REWARDKIT_FORCE_SUBSCRIPTION = "${REWARDKIT_FORCE_SUBSCRIPTION:-1}"
REWARDKIT_JUDGE = "${CONSULT_EVAL_JUDGE:-claude-code}"
