schema_version = "1.3"

[task]
name = "consult/routing-worker-retry"
description = "Plan the engineering lenses for a background retry change."

[metadata]
kind = "routing"
features = ["proof"]

[agent]
timeout_sec = 600.0

[verifier]
timeout_sec = 600.0

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
REWARDKIT_FORCE_SUBSCRIPTION = "${REWARDKIT_FORCE_SUBSCRIPTION:-1}"
REWARDKIT_JUDGE = "${CONSULT_EVAL_JUDGE:-claude-code}"
