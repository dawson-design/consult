schema_version = "1.4"
# The request step records only whether the agent stopped; the trial reward is the final step's.
multi_step_reward_strategy = "final"

[task]
name = "consult/proof-organize-tangled-seam"
description = "Extend a tangled order flow and prove discount rules at a clean seam."

[metadata]
kind = "code"
features = ["proof", "refactoring", "architecture"]

# Generous on purpose: an Opus turn at xhigh effort can run long, and a cut-off
# turn scores the harness, not the agent.
[agent]
timeout_sec = 2700.0

# The verifier runs the rubric judges: up to five calls, two at a time, each
# capped by CONSULT_JUDGE_TIMEOUT_SEC.
[verifier]
timeout_sec = 3600.0

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
REWARDKIT_FORCE_SUBSCRIPTION = "${REWARDKIT_FORCE_SUBSCRIPTION:-1}"
REWARDKIT_JUDGE = "${CONSULT_EVAL_JUDGE:-claude-code}"

# Step verifier timeouts must be set per step: a step's default is 600 and ignores [verifier].
[[steps]]
name = "request"
[steps.agent]
timeout_sec = 2700.0
[steps.verifier]
timeout_sec = 300.0

[[steps]]
name = "approve"
[steps.agent]
timeout_sec = 2700.0
[steps.verifier]
timeout_sec = 60.0

[[steps]]
name = "continue"
[steps.agent]
timeout_sec = 2700.0
[steps.verifier]
timeout_sec = 3600.0
