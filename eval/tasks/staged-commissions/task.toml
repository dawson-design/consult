schema_version = "1.4"
# Five feature stages built up in one repository, each a brief, an approval,
# and a continue turn. Step verifiers snapshot the workspace for the per-stage
# simplicity scores; the trial reward is the final step's.
multi_step_reward_strategy = "final"

[task]
name = "consult/staged-commissions"
description = "Build a furniture commissions service in five stages, scored on house style and simplicity as it grows."

[metadata]
kind = "code"
features = ["domain-modeling", "api", "database", "proof"]

[agent]
timeout_sec = 2700.0

# The verifier runs the acceptance tests and the rule probes, which start the
# app and a fake FX provider several times.
[verifier]
timeout_sec = 3600.0

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
REWARDKIT_FORCE_SUBSCRIPTION = "${REWARDKIT_FORCE_SUBSCRIPTION:-1}"
REWARDKIT_JUDGE = "${CONSULT_EVAL_JUDGE:-claude-code}"

# Step verifier timeouts must be set per step: a step's default is 600 and ignores [verifier].
[[steps]]
name = "s1-brief"
[steps.agent]
timeout_sec = 2700.0
[steps.verifier]
timeout_sec = 300.0

[[steps]]
name = "s1-approve"
[steps.agent]
timeout_sec = 2700.0
[steps.verifier]
timeout_sec = 300.0

[[steps]]
name = "s1-continue"
[steps.agent]
timeout_sec = 2700.0
[steps.verifier]
timeout_sec = 300.0

