schema_version = "1.3"

[task]
name = "consult/fork-config-or-constant"
description = "Take a platform fee off seller payouts; scored on whether the rate became a constant or an outside setting."

[metadata]
kind = "code"
features = ["proof"]

# Generous on purpose: an Opus turn at xhigh effort can run long, and a cut-off
# turn scores the harness, not the agent.
[agent]
timeout_sec = 2700.0

# No rubric yet, so no judge runs; the rule probe and hidden check finish in seconds.
[verifier]
timeout_sec = 600.0

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
REWARDKIT_FORCE_SUBSCRIPTION = "${REWARDKIT_FORCE_SUBSCRIPTION:-1}"
REWARDKIT_JUDGE = "${CONSULT_EVAL_JUDGE:-claude-code}"
