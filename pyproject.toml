# Maintainer tooling for the Consult skill pack: lint, type, and test tools
# for scripts/ and tests/. eval/ is a separate uv project with its own
# dependencies; ruff reads this file for eval/ too.

[project]
name = "consult-tooling"
version = "0.0.0"
description = "Maintainer tooling for the Consult skill pack."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
line-length = 120
# The eval verifier runs inside task containers on Debian bookworm's
# python3, which is 3.11.
target-version = "py311"
extend-exclude = ["eval/tasks", "eval/triggers/fixtures", "eval/verifier/tests/fixtures"]

[tool.ruff.lint.per-file-ignores]
# Test classes keep per-case fixtures as class attributes that no test
# mutates; ClassVar annotations on each would add noise and no safety.
"eval/verifier/tests/*" = ["RUF012"]

[tool.mypy]
strict = true
files = ["scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff==0.17.2",
]
