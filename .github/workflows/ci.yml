name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The checks only read the checkout. The repository default is already
# read-only; saying so here keeps that true if the default ever changes.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to a commit, so a moved tag cannot change what
      # runs here.
      # tests/test_ci_workflow.py enforces the pins and the permissions.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Node serves only the eval's JS hidden checks and the TypeScript code
      # analyzer their tests run. The repo's own tooling is Python.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # ruff, mypy, and pytest are pinned in the root pyproject.toml and uv.lock.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # Each check is its own step so one failure does not mask the others. The
      # cheap deterministic checks run first: skill prose is the common change,
      # and the validator is what covers it.
      - name: Skill anatomy and plugin drift
        run: make validate

      - name: Python lint and format
        if: ${{ !cancelled() }}
        run: make lint

      - name: Type check
        if: ${{ !cancelled() }}
        run: make typecheck

      # The maintainer scripts, the site's facts and generated skills page, and
      # this workflow's pins.
      - name: Repo tests
        if: ${{ !cancelled() }}
        run: make test

      # The verifier copy in every eval task matches eval/verifier/, and every
      # rule check passes its fixtures. Runs no models.
      - name: Eval checks
        if: ${{ !cancelled() }}
        run: make eval
